<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1d22" />
      <stop offset="50%" stop-color="#24272e" />
      <stop offset="100%" stop-color="#181a1f" />
    </linearGradient>

    <!-- Lavender Accent Gradient -->
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a7b9e" />
      <stop offset="50%" stop-color="#b49fcc" />
      <stop offset="100%" stop-color="#cebee2" />
    </linearGradient>

    <!-- Industrial Grid Pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#2d303a" stroke-width="1" opacity="0.6"/>
    </pattern>

    <!-- Dots Pattern -->
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#3b3747" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="3840" height="2160" fill="url(#bgGrad)" />
  <rect width="3840" height="2160" fill="url(#grid)" />
  <rect width="3840" height="2160" fill="url(#dots)" />

  <!-- Industrial Diagonal Accent Bars -->
  <path d="M 0 0 L 900 0 L 600 2160 L 0 2160 Z" fill="#202229" opacity="0.4" />
  <line x1="900" y1="0" x2="600" y2="2160" stroke="#b49fcc" stroke-width="2" opacity="0.25" />
  <line x1="920" y1="0" x2="620" y2="2160" stroke="#b49fcc" stroke-width="1" stroke-dasharray="10 15" opacity="0.2" />

  <!-- Audio Waveform / Synthesizer Frequency Visualizer -->
  <g opacity="0.35">
    <path d="M 400 1080 Q 700 920 1000 1080 T 1600 1080 T 2200 1080 T 2800 1080 T 3440 1080" fill="none" stroke="#b49fcc" stroke-width="3" />
    <path d="M 400 1080 Q 750 820 1100 1080 T 1800 1080 T 2500 1080 T 3200 1080 T 3440 1080" fill="none" stroke="#88c0d0" stroke-width="1.5" stroke-dasharray="6 8" />
    <path d="M 400 1080 Q 650 1240 1000 1080 T 1700 1080 T 2400 1080 T 3100 1080 T 3440 1080" fill="none" stroke="#6f737e" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Central Industrial Geometric Emblem -->
  <g transform="translate(1920, 1080)">
    <!-- Outer Hexagonal Tech Ring -->
    <circle r="360" fill="none" stroke="#333742" stroke-width="2" stroke-dasharray="12 16" />
    <circle r="340" fill="none" stroke="#b49fcc" stroke-width="1.5" opacity="0.4" />
    <circle r="290" fill="#1f2127" stroke="#3a3644" stroke-width="2" />

    <!-- Waveform Frequency Bars (Voice Synth / UTAU tribute) -->
    <g transform="translate(-180, -40)">
      <rect x="20" y="20" width="8" height="40" fill="#b49fcc" rx="4" />
      <rect x="45" y="-10" width="8" height="100" fill="#cebee2" rx="4" />
      <rect x="70" y="10" width="8" height="60" fill="#b49fcc" rx="4" />
      <rect x="95" y="-30" width="8" height="140" fill="#b49fcc" rx="4" />
      <rect x="120" y="5" width="8" height="70" fill="#88c0d0" rx="4" />
      <rect x="145" y="-50" width="8" height="180" fill="url(#lavenderGrad)" rx="4" />
      <rect x="170" y="-20" width="8" height="120" fill="#b49fcc" rx="4" />
      <rect x="195" y="15" width="8" height="50" fill="#88c0d0" rx="4" />
      <rect x="220" y="-40" width="8" height="160" fill="url(#lavenderGrad)" rx="4" />
      <rect x="245" y="-5" width="8" height="90" fill="#b49fcc" rx="4" />
      <rect x="270" y="10" width="8" height="60" fill="#8a7b9e" rx="4" />
      <rect x="295" y="-15" width="8" height="110" fill="#cebee2" rx="4" />
      <rect x="320" y="25" width="8" height="30" fill="#b49fcc" rx="4" />
    </g>

    <!-- Typography -->
    <text x="0" y="140" font-family="'JetBrains Mono', 'Fira Code', 'Ubuntu Mono', monospace" font-size="44" font-weight="900" fill="#ded8e6" letter-spacing="18" text-anchor="middle">DEFOKOS</text>
    <text x="0" y="180" font-family="'JetBrains Mono', 'Fira Code', 'Ubuntu Mono', monospace" font-size="16" font-weight="500" fill="#b49fcc" letter-spacing="8" text-anchor="middle">UTANE UTA // SYS.01</text>
    <text x="0" y="215" font-family="'JetBrains Mono', 'Fira Code', 'Ubuntu Mono', monospace" font-size="12" font-weight="400" fill="#6f737e" letter-spacing="4" text-anchor="middle">SYNTHESIS &amp; DEV WORKSTATION</text>
  </g>

  <!-- Industrial Tech Markers & Corner Indicators -->
  <g fill="#b49fcc" opacity="0.4" font-family="monospace" font-size="14">
    <!-- Top-Left -->
    <text x="80" y="100">SYSTEM: DEFOKOS_COSMIC</text>
    <text x="80" y="125">BUILD_TARGET: x86_64_LINUX</text>
    <path d="M 60 70 L 60 140 M 60 70 L 130 70" stroke="#b49fcc" stroke-width="2" fill="none" />

    <!-- Top-Right -->
    <text x="3520" y="100" text-anchor="end">STATUS: ARMED / READY</text>
    <text x="3520" y="125" text-anchor="end">CORE: PIPEWIRE_PRO_AUDIO</text>
    <path d="M 3780 70 L 3780 140 M 3780 70 L 3710 70" stroke="#b49fcc" stroke-width="2" fill="none" />

    <!-- Bottom-Left -->
    <text x="80" y="2060">PALETTE: #B49FCC // #24272E</text>
    <text x="80" y="2085">KERNEL: LINUX_GENERIC_LTS</text>
    <path d="M 60 2100 L 60 2030 M 60 2100 L 130 2100" stroke="#b49fcc" stroke-width="2" fill="none" />

    <!-- Bottom-Right -->
    <text x="3520" y="2060" text-anchor="end">ACOUSTICS: UTANE_UTA</text>
    <text x="3520" y="2085" text-anchor="end">COSMIC_EDITION</text>
    <path d="M 3780 2100 L 3780 2030 M 3780 2100 L 3710 2100" stroke="#b49fcc" stroke-width="2" fill="none" />
  </g>
</svg>
