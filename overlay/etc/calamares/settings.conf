---
modules-search:
  - /usr/lib/x86_64-linux-gnu/calamares/modules
  - /usr/share/calamares/modules
  - /usr/lib/calamares/modules
  - local

instances:
- id:       postinstall
  module:   shellprocess
  config:   shellprocess-postinstall.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@postinstall
  - umount
- show:
  - finished

branding: defokos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
