# ==============================================================================
#  DEFOKOS // KITTY TERMINAL CONFIGURATION
#  Theme: Utane Uta / Defoko (Lavender & Industrial Charcoal)
# ==============================================================================

# --- Tipografía ---
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- Apariencia de Ventana y Relleno ---
window_padding_width  14
background_opacity    0.95
dynamic_background_opacity yes
confirm_os_window_close 0

# --- Esquema de Colores (Defoko Theme) ---
background            #24272e
foreground            #ded8e6
selection_background  #464052
selection_foreground  #ffffff
url_color             #b49fcc

# Cursor
cursor                #b49fcc
cursor_text_color     #24272e
cursor_shape          beam
cursor_blink_interval 0.5

# Bordes y división
active_border_color   #b49fcc
inactive_border_color #333640

# Barra de pestañas
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground   #24272e
active_tab_background   #b49fcc
active_tab_font_style   bold
inactive_tab_foreground #9e9ba8
inactive_tab_background #2e313b

# --- Paleta ANSI (Estética Industrial / Voz Sintética) ---
# Black
color0                #24272e
color8                #4a4756

# Red (Soft berry / error)
color1                #d87c95
color9                #eb99b0

# Green (Synthetic phosphor green)
color2                #8ec09c
color10               #a8d8b5

# Yellow (Industrial warning warm gold)
color3                #dec18a
color11               #f3d8a6

# Blue (Steel slate blue)
color4                #869ec7
color12               #a2b9de

# Magenta (Defoko Lavender Signature)
color5                #b49fcc
color13               #cebee2

# Cyan (Cool tone signal)
color6                #86bece
color14               #a4d6e4

# White (Off-white silk)
color7                #ded8e6
color15               #f5f0fa

# Audio / Bell
enable_audio_bell     no
visual_bell_duration  0.1
visual_bell_color     #4a4756
