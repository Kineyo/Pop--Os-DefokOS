<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Pixelify Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Pixelify Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>Cantarell</family>
    <prefer>
      <family>Pixelify Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>Ubuntu</family>
    <prefer>
      <family>Pixelify Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>Fira Sans</family>
    <prefer>
      <family>Pixelify Sans</family>
    </prefer>
  </alias>
</fontconfig>
